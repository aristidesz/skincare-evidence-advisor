[project]
name = "streamlit_chat"
version = "0.1.0"
description = "A Streamlit chat application"
requires-python = ">=3.9"
authors = [
    { name = "Aristides Zenonos", email = "aristideszenonos@gmail.com" }
]
dependencies = [
    "langchain>=0.3.23",
    "langchain-community>=0.3.21",
    "langchain-core>=0.3.51",
    "langchain-ollama>=0.3.1",
    "langsmith>=0.3.28",
    "pypdf>=5.4.0",
    "streamlit",
]

[project.optional-dependencies]
test = [
    "pytest",
    "coverage",
    "seleniumbase>=4.35.2",
]
lint = [
    "black",
    "isort",
    "flake8",
    "mypy",
    "bandit",
]
dev = [
    "streamlit_chat[test,lint]",
]

[tool.black]
exclude = '''
/(
    \.venv
    | venv
    | build
    | dist
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.tox
)/
'''

[tool.isort]
profile = 'black'
multi_line_output = 3
skip = ['.cache', '.pytest_cache', 'venv', 'coverage', '.git']

[tool.coverage.run]
omit = ['tests/*']

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'if settings.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
]

[tool.pytest.ini_options]
minversion = "6.0"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pre-commit>=4.2.0",
    "seleniumbase>=4.35.2",
]
